<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
<script>
class Person {
    static count = 0;
    constructor(id, name, age) {
        this.id = id;
        this.name = name;
        this.age = age;
        Person.count++;
    }
    displayDetails() {
        console.log("ID:", this.id);
        console.log("Name:", this.name);
        console.log("Age:", this.age);
    }
    static displayCount() {
        console.log("Total Persons:", Person.count);
    }
}
class Doctor extends Person {
    constructor(id, name, age, specialization, consultationFee) {
        super(id, name, age);
        this.specialization = specialization;
        this.consultationFee = consultationFee;
    }
    displayDetails() {
        super.displayDetails();
        console.log("Specialization:", this.specialization);
        console.log("Consultation Fee:", this.consultationFee);
    }
}
class Patient extends Person {
    constructor(id, name, age, disease, roomNo) {
        super(id, name, age);
        this.disease = disease;
        this.roomNo = roomNo;
    }
    displayDetails() {
        super.displayDetails();
        console.log("Disease:", this.disease);
        console.log("Room No:", this.roomNo);
    }
}
let d1 = new Doctor(101, "Aman", 40, "Cardiology", 500);
let d2 = new Doctor(102, "Riya", 35, "Neurology", 600);
let p1 = new Patient(201, "Rahul", 25, "Fever", 12);
let p2 = new Patient(202, "Neha", 30, "Diabetes", 15);
console.log("Doctor Details:");
d1.displayDetails();
d2.displayDetails();
console.log("Patient Details:");
p1.displayDetails();
p2.displayDetails();

Person.displayCount();
</script>
</body>
</html>
