<html>
    <head>
        <script>
            function info(){
                let age=parseInt(prompt("Enter your age:"));
                if(age>=18){
                    let c=confirm("do you want to vote?");
                    if (c){
                        alert("your response is recorded");
                    }
                    else{
                        alert("your response is not recorded");
                    }
            }
        }
        </script>
    </head>
    <body>
        <input type="button" value="Check Eligibility" onclick="info()">
    </body>
</html>
