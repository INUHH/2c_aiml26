<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
</head>
<body>

    <h1>Registration Form</h1>

    <form action="" name="registration" onsubmit="return validate()">

        <label>Name: </label>
        <input type="text" name="name" id="name">
        <br><br>

        <label>Email: </label>
        <input type="text" name="email" id="email">
        <br><br>

        <label>Password: </label>
        <input type="password" name="password" id="password">
        <br><br>

        <label>Re-Password: </label>
        <input type="password" name="re-password" id="re-password">
        <br><br>

        <label>Mobile: </label>
        <input type="text" name="mobile" id="mobile">
        <br><br>

        <input type="submit" value="Submit">

    </form>

    <script>
        function validate() {
            var n = document.registration.name.value;

            if (n.trim() == "") {
                alert("Fill your name");
                return false;
            }
            if (n.length < 3) {
                alert("Name must be at least 3 characters long");
                return false;
            }

            var number = document.registration.mobile.value;

            if (number.length != 10 || isNaN(number)) {
                alert("Fill your mobile number");
                return false;
            }

            var e = document.registration.email.value;

            if (e.indexOf("@") == -1 || e.indexOf(".") == -1) {
                alert("Enter a valid email address");
                return false;
            }

            return true;
        }
    </script>

</body>
</html>
