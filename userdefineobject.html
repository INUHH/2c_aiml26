<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Defined Object</title>

    <script>
        let student = new Object();

        student.name = "John";
        student.id = 3045;
        student.city = "Ghaziabad";

        student.learning = function() {
            console.log("Learning tech courses");
        };

        console.log(student.name);
        student.learning();
    </script>
</head>

<body>
</body>
</html>
