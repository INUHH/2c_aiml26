<html>
   <head>
    <script>
        function info(){
            let a=parseInt(prompt("Enter value of a:"));
            if(a>=18){
                alert("you are eligible for voting");
            }
            else{
                alert("you are not eligible for voting");
            }
        }
    </script>
    <body>
        <input type="button" value="Check Eligibility" onclick="info()">
    </body>
   </head>
</html>
